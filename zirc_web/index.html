<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zirc Polgármesteri Hivatal online bejelentője</title>
    <link rel="stylesheet" href="styleadat2.css">
    <link rel="icon" type="image/x-icon" href="icon.png">
</head>
<body>
    <div id="bekero">
        <h1>Zirc Polgármesteri Hivatal – online bejelentés</h1>
        <p id="szoveg1">
            A várakozásmentes, gyors ügyintézés érdekében kérjük, végezze el az előzetes adategyeztetést. <br>
            <span id="aszf-open" style="cursor:pointer; text-decoration:underline;">Az Általános adatkezelési tájékoztatót itt éri el</span>.
        </p>
        
        <form novalidate>
            <label for="teljes-nev">Teljes név:</label>
            <input type="text" id="teljes-nev" placeholder="Vezetéknév Keresztnév" name="teljes_nev" required>
            <br><br>

            <label for="szuletes-ev">Születési idő:</label>
            <input type="text" inputmode="numeric" id="szuletes-ev" placeholder="ÉÉÉÉ" name="szu_ev" required 
                oninput="this.value=this.value.replace(/[^0-9]/g,''); if(this.value.length >= 4) { this.value = this.value.slice(0,4); document.getElementById('szuletes-honap').focus(); }">
            
            <input type="text" inputmode="numeric" id="szuletes-honap" placeholder="HH" name="szu_honap" required 
                oninput="this.value=this.value.replace(/[^0-9]/g,''); if(this.value.length >= 2) { this.value = this.value.slice(0,2); document.getElementById('szuletes-nap').focus(); }">
            
            <input type="text" inputmode="numeric" id="szuletes-nap" placeholder="NN" name="szu_nap" required 
                oninput="this.value=this.value.replace(/[^0-9]/g,''); if(this.value.length >= 2) { this.value = this.value.slice(0,2); document.getElementById('lakcim-iranyitoszam').focus(); }">
            <br><br>

            <label for="lakcim-iranyitoszam">Lakcím:</label>
            <input type="text" inputmode="numeric" name="iranyitoszam" required id="lakcim-iranyitoszam" placeholder="Irányítószám" value="8420" oninput="if(this.value.length >= 4) document.getElementById('lakcim-varos').focus();">
            <input type="text" id="lakcim-varos" placeholder="Város" value="Zirc" name="varos" required>
            <input type="text" id="lakcim-utca" placeholder="Utca, hsz., em./ajtó" size="40" name="utca" required>
            <br><br>

            <label for="tel-korzet">Telefonszám:</label>
            <input type="text" id="tel-orszag" value="+36" size="3" readonly>
            <input type="text" inputmode="numeric" name="tel_korzet" required id="tel-korzet" placeholder="30" oninput="if(this.value.length >= 2) document.getElementById('tel-szam').focus();">
            <input type="text" inputmode="numeric" name="tel_szam" required id="tel-szam" placeholder="1234567">
            <br><br>

            <label for="email-cim">E-mail cím:</label>
            <input type="email" id="email-cim" placeholder="pelda@email.hu" name="email" required>
            <br><br>

            <label for="uzenet-szoveg">Kapcsolatfelvétel vagy ügyintézés oka:</label><br>
            <textarea id="uzenet-szoveg" maxlength="1000" rows="5" cols="60" name="uzenet" required oninput="document.getElementById('szamlalo').innerText = this.value.length"></textarea>
            <br>
            <span>Karakterszám: <span id="szamlalo">0</span> / 1000</span>
            <br><br>

            <div id="adatvedelmi-igenyles">
                <label>
                    <input type="checkbox" id="adatvedelem">
                    <span>Elolvastam és elfogadom az <a href="https://adatvedelemzirc.netlify.app/" id="aszf-link">adatvédelmi tájékoztatót</a>.</span>
                </label>
            </div>
            <button id="bekuldogomb" type="submit">Beküldés</button> 
        </form>
    </div>

    <script>
  
    const aszfModal = document.getElementById("aszf-modal");
    const aszfOpen = document.getElementById("aszf-open");
    const aszfClose = document.getElementById("aszf-close");
    if(aszfOpen) aszfOpen.onclick = () => aszfModal.style.display = "block";
    if(aszfClose) aszfClose.onclick = () => aszfModal.style.display = "none";

    function errorShake(element) {
        if (!element) return;
        element.classList.add('shake-error');
        setTimeout(() => element.classList.remove('shake-error'), 500);
    }

    function checkAge() {
   
        const d = document.getElementById("szuletes-nap");
        const m = document.getElementById("szuletes-honap");
        const y = document.getElementById("szuletes-ev");

        const day = parseInt(d.value, 10);
        const month = parseInt(m.value, 10) - 1;
        const year = parseInt(y.value, 10);

        if (isNaN(day) || isNaN(month) || isNaN(year)) {
            alert("Töltsön ki minden mezőt helyesen, és próbálja újra!");
            return false;
        }

        const birthDate = new Date(year, month, day);
        const today = new Date();
        
        const isValid = birthDate.getFullYear() === year && birthDate.getMonth() === month && birthDate.getDate() === day;

        if (!isValid || birthDate > today || year < 1900) {
            alert("Töltsön ki minden mezőt helyesen, és próbálja újra!");
            return false;
        }

        let age = today.getFullYear() - birthDate.getFullYear();
        if (today.getMonth() < month || (today.getMonth() === month && today.getDate() < day)) {
            age--;
        }

        if (age < 18) {
            alert("Töltsön ki minden mezőt helyesen, és próbálja újra!");
            return false;
        }
        return true;
    }

    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!checkAge()) return;

        const checkbox = document.getElementById("adatvedelem");
        if (checkbox && !checkbox.checked) {
            alert("Kérjük, fogadja el az adatkezelési tájékoztatót!");
            errorShake(checkbox.parentElement);
            return;
        }

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/.netlify/functions/mentes', {
                method: 'POST',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/json' }
            });

            if (response.ok) {
                alert('Sikeres beküldés!');
                e.target.reset();
                document.getElementById('szamlalo').innerText = "0";
            } else {
                alert('Hiba történt a küldés során (Szerver hiba).');
            }
        } catch (error) {
            alert('Töltsön ki minden mezőt helyesen, és próbálja újra!');
        }
    });
    </script>
</body>
</html>
