<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zirc Polgármesteri Hivatal online bejelentője</title>
    <link rel="stylesheet" href="styleadat2.css">
    <link rel="icon" type="image/x-icon" href="icon.png">
</head>
<body>
    <div id="aszf-modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px);">
        <div class="aszf-box" style="background: white; margin: 5% auto; padding: 30px; width: 70%; max-height: 80%; overflow-y: auto; border-radius: 15px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
            <button id="aszf-close" style="position: absolute; right: 20px; top: 20px; cursor: pointer; border: none; background: #eee; border-radius: 50%; width: 30px; height: 30px;">✕</button>
            <div id="modal-text-content">
                <h2>Általános adatkezelési tájékoztató</h2>
                <p><strong>Zirc Polgármesteri Hivatal</strong></p>
            </div>
        </div>
    </div>

    <div id="bekero">
        <h1>Zirc Polgármesteri Hivatal – online bejelentés</h1>
        <p id="szoveg1">
            A várakozásmentes ügyintézéshez kérjük, töltse ki az alábbi mezőket. <br>
            <span id="aszf-open" style="color: #1e3a8a; text-decoration: underline; cursor: pointer; font-weight: 600;">Adatkezelési tájékoztató megnyitása</span>.
        </p>
        
        <form id="main-form" novalidate>
            <label for="teljes-nev">Teljes név:</label>
            <input type="text" id="teljes-nev" name="teljes_nev" placeholder="Vezetéknév Keresztnév" required>
            <br><br>

            <label>Születési idő:</label>
            <input type="text" inputmode="numeric" id="szu_ev" name="szu_ev" placeholder="ÉÉÉÉ" required maxlength="4" style="width: 60px;">
            <input type="text" inputmode="numeric" id="szu_honap" name="szu_honap" placeholder="HH" required maxlength="2" style="width: 40px;">
            <input type="text" inputmode="numeric" id="szu_nap" name="szu_nap" placeholder="NN" required maxlength="2" style="width: 40px;">
            <br><br>

            <label>Lakcím:</label>
            <input type="text" inputmode="numeric" id="iranyitoszam" name="iranyitoszam" placeholder="Irányítószám" value="8420" required style="width: 80px;">
            <input type="text" id="varos" name="varos" placeholder="Város" value="Zirc" required>
            <input type="text" id="utca" name="utca" placeholder="Utca, házszám, ajtó" size="30" required>
            <br><br>

            <label>Telefonszám:</label>
            <input type="text" value="+36" size="3" disabled>
            <input type="text" inputmode="numeric" id="tel_korzet" name="tel_korzet" placeholder="30" required maxlength="2" style="width: 40px;">
            <input type="text" inputmode="numeric" id="tel_szam" name="tel_szam" placeholder="1234567" required maxlength="7" style="width: 100px;">
            <br><br>

            <label for="email">E-mail cím:</label>
            <input type="email" id="email" name="email" placeholder="pelda@email.hu" required>
            <br><br>

            <label for="uzenet">Bejelentés oka:</label><br>
            <textarea id="uzenet" name="uzenet" maxlength="1000" rows="5" style="width: 100%; box-sizing: border-box;" required></textarea>
            <br>
            <span>Karakterek: <span id="szamlalo">0</span> / 1000</span>
            <br><br>

            <div id="gdpr-box">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="adatvedelem" required>
                    <span>Elolvastam és elfogadom az adatvédelmi tájékoztatót.</span>
                </label>
            </div>
            <br>
            <button id="submit-btn" type="submit" style="padding: 12px 25px; cursor: pointer; background: #1e3a8a; color: white; border: none; border-radius: 5px;">Beküldés</button> 
        </form>
    </div>

    <script>
    const modal = document.getElementById("aszf-modal");
    const form = document.getElementById("main-form");

    document.getElementById("aszf-open").onclick = () => modal.style.display = "block";
    document.getElementById("aszf-close").onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") modal.style.display = "none"; });

    const focusFlow = (id, next, limit) => {
        document.getElementById(id).addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length >= limit) document.getElementById(next).focus();
        });
    };
    focusFlow("szu_ev", "szu_honap", 4);
    focusFlow("szu_honap", "szu_nap", 2);
    focusFlow("szu_nap", "iranyitoszam", 2);
    focusFlow("tel_korzet", "tel_szam", 2);

    document.getElementById("uzenet").oninput = function() {
        document.getElementById("szamlalo").innerText = this.value.length;
    };

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const reqs = form.querySelectorAll('[required]');
        let ok = true;
        reqs.forEach(el => {
            if (!el.value.trim() || (el.type === 'checkbox' && !el.checked)) {
                ok = false;
                el.style.outline = "2px solid red";
                setTimeout(() => el.style.outline = "none", 2000);
            }
        });

        if (!ok) {
            alert("Minden mező kitöltése kötelező!");
            return;
        }

        const y = parseInt(document.getElementById("szu_ev").value);
        const m = parseInt(document.getElementById("szu_honap").value) - 1;
        const d = parseInt(document.getElementById("szu_nap").value);
        const bDate = new Date(y, m, d);
        const now = new Date();
        let age = now.getFullYear() - bDate.getFullYear();
        if (now.getMonth() < m || (now.getMonth() === m && now.getDate() < d)) age--;

        if (isNaN(age) || age < 18 || bDate > now || y < 1900) {
            alert("Érvénytelen dátum vagy 18 év alatti életkor!");
            return;
        }

        const data = Object.fromEntries(new FormData(form).entries());

        try {
            const res = await fetch('/.netlify/functions/mentes', {
                method: 'POST',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/json' }
            });

            if (res.ok) {
                alert('Sikeres beküldés!');
                form.reset();
                document.getElementById('szamlalo').innerText = "0";
            } else {
                alert('Szerver hiba történt.');
            }
        } catch (err) {
            alert('Hálózati hiba!');
        }
    });
    </script>
</body>
</html>
